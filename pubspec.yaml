name: shadow_hunt
description: A multiplayer horror game - Hunter vs Survivors

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  cloud_firestore: ^5.4.4

  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  audioplayers: ^6.0.0
  sensors_plus: ^4.0.2
  torch_light: ^1.0.1
  uuid: ^4.3.3
  provider: ^6.1.1
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/animations/